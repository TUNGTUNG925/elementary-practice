<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>國小國語・數學綜合練習</title>
  <style>
    :root { --primary:#2563eb; --primary-dark:#1d4ed8; --green:#15803d; --red:#dc2626; --ink:#1f2937; --muted:#64748b; --line:#dbe3ef; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; color:var(--ink); background:linear-gradient(135deg,#e0f2fe,#fef3c7); min-height:100vh; }
    .wrap { max-width:960px; margin:auto; padding:28px 16px 50px; }
    header { text-align:center; margin-bottom:22px; }
    h1 { margin:0; color:#1d4ed8; font-size:clamp(1.7rem,5vw,2.45rem); }
    header p { margin:8px 0 0; color:#475569; }
    .card { background:rgba(255,255,255,.96); border-radius:20px; padding:24px; box-shadow:0 12px 32px rgba(30,64,175,.15); }
    .hidden { display:none !important; }
    h2 { margin:0 0 14px; font-size:1.25rem; }
    h3 { margin:20px 0 10px; font-size:1.05rem; }
    .subject-row,.grade-grid,.mode-grid,.number-grid { display:flex; flex-wrap:wrap; gap:12px; }
    .subject-btn { flex:1 1 180px; min-height:78px; border:3px solid #bfdbfe; background:#eff6ff; border-radius:16px; cursor:pointer; color:#1e40af; font-size:1.2rem; font-weight:700; }
    .subject-btn.active { border-color:var(--primary); background:#dbeafe; box-shadow:0 0 0 3px #bfdbfe; }
    .grade-label,.type-label { display:flex; align-items:center; justify-content:center; gap:7px; flex:1 1 140px; min-height:52px; padding:8px 10px; border:2px solid #e2e8f0; border-radius:12px; cursor:pointer; font-size:1rem; font-weight:700; }
    .grade-label:has(input:checked),.type-label:has(input:checked) { background:#ecfdf5; border-color:#22c55e; color:#166534; }
    .number-btn { flex:1 1 95px; min-height:50px; border:2px solid #cbd5e1; background:#fff; color:#334155; }
    .number-btn.active { background:#dbeafe; border-color:var(--primary); color:#1d4ed8; }
    input[type="checkbox"] { width:18px; height:18px; accent-color:#16a34a; }
    input[type="text"] { width:100%; padding:12px 14px; border:2px solid #cbd5e1; border-radius:12px; font:inherit; font-size:1rem; }
    .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:22px; }
    button { border:0; border-radius:12px; padding:12px 19px; cursor:pointer; font-size:1rem; font-weight:700; }
    .primary { background:var(--primary); color:white; } .primary:hover { background:var(--primary-dark); }
    .secondary { background:#e2e8f0; color:#334155; } .secondary:hover { background:#cbd5e1; }
    .danger { background:#fee2e2; color:#991b1b; } .danger:hover { background:#fecaca; }
    .small { padding:8px 12px; font-size:.9rem; }
    .quiz-top { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
    .badges { display:flex; flex-wrap:wrap; gap:7px; }
    .badge { display:inline-block; padding:6px 10px; border-radius:999px; background:#dbeafe; color:#1d4ed8; font-weight:700; font-size:.94rem; }
    .score { font-weight:700; color:#475569; }
    .progress { height:9px; background:#e2e8f0; border-radius:99px; overflow:hidden; margin:12px 0 0; }
    .progress > div { height:100%; width:0; background:linear-gradient(90deg,#22c55e,#3b82f6); transition:width .25s; }
    .tips { color:var(--muted); font-size:.92rem; margin:12px 0 0; text-align:center; }
    .question-box { margin-top:14px; background:#f8fafc; border:2px solid #e2e8f0; border-radius:16px; padding:20px; }
    .question { white-space:pre-line; font-size:1.35rem; font-weight:700; line-height:1.7; margin:0 0 18px; }
    .options { display:grid; gap:10px; }
    .option { width:100%; text-align:left; background:white; border:2px solid #cbd5e1; color:#334155; padding:13px 15px; border-radius:12px; font-weight:600; }
    .option:hover:not(:disabled) { border-color:#60a5fa; background:#eff6ff; }
    .option.correct { background:#dcfce7; border-color:#22c55e; color:#166534; }
    .option.wrong { background:#fee2e2; border-color:#ef4444; color:#991b1b; }
    .feedback { min-height:31px; margin:15px 0 0; font-size:1.05rem; font-weight:700; line-height:1.55; }
    .feedback.ok { color:var(--green); } .feedback.bad { color:var(--red); }
    .work-area { margin-top:16px; background:#fffdf4; border:2px dashed #f59e0b; border-radius:16px; padding:14px; }
    .work-area h3 { margin:0 0 8px; color:#92400e; }
    .work-row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
    #workCanvas { display:block; width:100%; height:260px; background:#fff; border:2px solid #cbd5e1; border-radius:12px; touch-action:none; cursor:crosshair; }
    .result-title { text-align:center; color:#1d4ed8; font-size:1.65rem; margin:0 0 10px; }
    .result-score { text-align:center; font-size:1.35rem; font-weight:800; color:#166534; margin:8px 0; }
    .result-message { text-align:center; color:#475569; margin:8px 0 20px; }
    .wrong-list { display:grid; gap:12px; margin-top:15px; }
    .wrong-card { border:2px solid #fecaca; background:#fff7f7; border-radius:14px; padding:14px; }
    .wrong-card p { margin:5px 0; line-height:1.55; white-space:pre-line; }
    .wrong-card .answer { color:#166534; font-weight:700; }
    .empty { padding:20px; text-align:center; color:#166534; background:#ecfdf5; border-radius:14px; font-weight:700; }
    @media (max-width:560px) { .card{padding:17px} .question{font-size:1.18rem} #workCanvas{height:210px} .grade-label,.type-label{flex-basis:125px} }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>🌟 國小綜合練習</h1>
      <p>選科目、年級與題型，完成一份專屬練習卷。</p>
    </header>

    <section id="setup" class="card">
      <h2>1. 選擇科目</h2>
      <div class="subject-row">
        <button class="subject-btn" type="button" data-subject="國語">📖 國語</button>
        <button class="subject-btn" type="button" data-subject="數學">🔢 數學</button>
      </div>

      <h2 style="margin-top:24px">2. 複選年級</h2>
      <div class="grade-grid">
        <label class="grade-label"><input type="checkbox" value="1">一年級</label>
        <label class="grade-label"><input type="checkbox" value="2">二年級</label>
        <label class="grade-label"><input type="checkbox" value="3">三年級</label>
        <label class="grade-label"><input type="checkbox" value="4">四年級</label>
      </div>

      <h2 style="margin-top:24px">3. 選擇題型（可複選）</h2>
      <div id="typeFilters" class="mode-grid"></div>
      <p class="tips">不勾選題型時，會自動包含所選年級的全部題型。</p>

      <h2 style="margin-top:24px">4. 設定測驗</h2>
      <h3>學生姓名（選填）</h3>
      <input id="studentName" type="text" maxlength="20" placeholder="例如：小明">
      <h3>題數</h3>
      <div class="number-grid" id="countButtons">
        <button class="number-btn active" type="button" data-count="10">10 題</button>
        <button class="number-btn" type="button" data-count="20">20 題</button>
        <button class="number-btn" type="button" data-count="30">30 題</button>
        <button class="number-btn" type="button" data-count="0">全部</button>
      </div>
      <div class="actions"><button id="startBtn" class="primary" type="button">開始測驗</button></div>
      <p class="tips">題目與選項都會隨機排列；若所選題庫不足設定題數，會自動使用可用題目數。</p>
    </section>

    <section id="quiz" class="card hidden" aria-live="polite">
      <div class="quiz-top">
        <div class="badges"><span id="subjectBadge" class="badge"></span><span id="gradeBadge" class="badge"></span><span id="typeBadge" class="badge"></span></div>
        <div id="score" class="score">答對 0／0 題</div>
      </div>
      <div class="progress"><div id="progressBar"></div></div>
      <p id="remaining" class="tips"></p>
      <div class="question-box">
        <p id="question" class="question"></p>
        <div id="options" class="options"></div>
        <p id="feedback" class="feedback"></p>
      </div>

      <section id="workArea" class="work-area hidden">
        <div class="work-row"><h3>✏️ 數學驗算區</h3><button id="clearCanvasBtn" class="danger small" type="button">清除筆跡</button></div>
        <p class="tips" style="margin:0 0 9px">可用滑鼠、手指或觸控筆在空白處手寫驗算。</p>
        <canvas id="workCanvas" aria-label="數學手寫驗算區"></canvas>
      </section>

      <div class="actions">
        <button id="nextBtn" class="primary" type="button">下一題</button>
        <button id="submitBtn" class="secondary" type="button">提早交卷</button>
        <button id="backBtn" class="secondary" type="button">重新設定</button>
      </div>
    </section>

    <section id="result" class="card hidden">
      <h2 class="result-title">🎉 測驗完成</h2>
      <p id="resultName" class="result-message"></p>
      <p id="resultScore" class="result-score"></p>
      <p id="resultMessage" class="result-message"></p>
      <h3>錯題整理</h3>
      <div id="wrongList" class="wrong-list"></div>
      <div class="actions">
        <button id="retryWrongBtn" class="primary" type="button">只練錯題</button>
        <button id="newTestBtn" class="secondary" type="button">重新設定新測驗</button>
      </div>
    </section>
  </main>

<script>
const questionBank = [];
function add(subject, grade, type, q, options, answer, explain) { questionBank.push({subject,grade,type,q,options,answer,explain}); }

// 國語一年級
add('國語',1,'拼字','「太陽」的「陽」讀音最接近哪一個？',['洋','羊','樣','揚'],1,'「陽」和「羊」都讀 ㄧㄤˊ。');
add('國語',1,'形容詞','請選出最適合的詞：\n「蘋果吃起來＿＿＿的。」',['甜甜','跑跑','看看','睡睡'],0,'「甜甜」可以形容蘋果的味道。');
add('國語',1,'造句','哪一句話正確使用了「開心」？',['我今天得到禮物，覺得很開心。','開心在桌上寫字。','媽媽買開心回家。','小狗開心一碗飯。'],0,'「開心」用來形容快樂的心情。');
add('國語',1,'形容詞','請選出最適合的詞：\n「白白的＿＿＿在天空飄。」',['雲朵','石頭','書包','鉛筆'],0,'白白的雲朵會在天空飄。');
add('國語',1,'筆畫','「花朵」的「朵」有幾畫？',['5畫','6畫','7畫','8畫'],1,'「朵」共有 6 畫。');
add('國語',1,'詞語','請選出可以放進句子的詞：\n「我每天＿＿＿去上學。」',['快快','高高','天天','早早'],3,'「早早去上學」語意最通順。');
add('國語',1,'造句','哪一句正確使用了「一起」？',['我和弟弟一起看故事書。','一起書包在桌上。','媽媽一起買菜。','小鳥一起天空。'],0,'「一起」表示共同做一件事。');
add('國語',1,'形容詞','請選出最適合的詞：\n「冰淇淋吃起來＿＿＿的。」',['冰冰','熱熱','長長','高高'],0,'冰淇淋的感覺是冰冰的。');
add('國語',1,'拼字','下面哪一個字和「手」有關？',['打','唱','明','花'],0,'「打」要用手來做。');
add('國語',1,'句子排序','請選出正確的句子。',['小狗在院子裡跑。','在小狗跑院子裡。','院子裡小狗在跑。','跑小狗在裡院子。'],0,'「小狗在院子裡跑。」語序完整又通順。');
add('國語',1,'形容詞','請選出最適合的詞：\n「長頸鹿有＿＿＿的脖子。」',['長長','短短','小小','圓圓'],0,'長頸鹿的脖子長長的。');
add('國語',1,'部首','「雨」是什麼部首？',['雨','水','天','日'],0,'「雨」本身就是一個部首。');
add('國語',1,'造句','哪一句話正確使用了「喜歡」？',['我喜歡吃媽媽煮的飯。','喜歡在桌上一本書。','小狗喜歡很可愛。','媽媽買喜歡回家。'],0,'「喜歡」可以說明自己愛好的事物。');
add('國語',1,'詞語','「爸爸在＿＿＿看報紙。」',['客廳','天空','書包','鉛筆'],0,'爸爸可以在客廳看報紙。');
add('國語',1,'改錯字','請找出錯字：\n「我門一起去公園玩。」',['我門 → 我們','一起 → 一起','公園 → 公元','玩 → 完'],0,'「我們」表示自己和其他人，應寫作「們」。');
add('國語',1,'形容詞','請選出最適合的詞：\n「兔子的尾巴＿＿＿的。」',['短短','長長','大大','重重'],0,'兔子的尾巴短短的。');
add('國語',1,'詞語理解','「早上」通常是什麼時候？',['太陽剛出來的時候','吃晚餐以後','要睡覺的時候','半夜的時候'],0,'早上是一天開始、太陽剛出來前後的時間。');
add('國語',1,'造句','哪一句話正確使用了「正在」？',['妹妹正在寫功課。','正在妹妹一支筆。','書包正在桌上。','正在我喜歡吃飯。'],0,'「正在」表示一件事情此刻進行中。');
add('國語',1,'拼字','下面哪一個字的讀音是「ㄏㄨㄚ」？',['花','草','樹','葉'],0,'「花」讀作 ㄏㄨㄚ。');
add('國語',1,'詞語','「小鳥在樹上＿＿＿。」',['唱歌','游泳','寫字','看書'],0,'小鳥會在樹上唱歌。');
add('國語',1,'句子理解','「媽媽把蛋糕切成四塊。」哪一個說法正確？',['蛋糕原本是一整個','媽媽吃了四個蛋糕','蛋糕變成一顆蛋','媽媽在畫蛋糕'],0,'「切成四塊」表示原本的一個蛋糕被分成四部分。');
add('國語',1,'形容詞','請選出最適合的詞：\n「大象的耳朵＿＿＿的。」',['大大','小小','細細','短短'],0,'大象有大大的耳朵。');
add('國語',1,'改錯字','請找出錯字：\n「太陽從東邊生起來。」',['生 → 升','陽 → 楊','東 → 冬','邊 → 便'],0,'太陽從東邊「升」起來。');

// 國語二年級
add('國語',2,'改錯字','請找出錯字並選出正確寫法：\n「小朋友排隊進入博物管。」',['朋 → 棚','隊 → 對','管 → 館','進 → 近'],2,'收藏、展示文物的地方叫「博物館」。');
add('國語',2,'形容詞','請選出最適合的詞：\n「媽媽煮的湯＿＿＿的，大家都喜歡喝。」',['香香','硬硬','黑黑','尖尖'],0,'好喝的湯通常聞起來香香的。');
add('國語',2,'造句','哪一句正確使用了「先……再……」？',['我先洗手，再吃點心。','我先點心，再吃手。','先我洗手再。','洗手先再吃。'],0,'「先……再……」表示做事的先後順序。');
add('國語',2,'詞語理解','「安靜」的意思最接近哪一個？',['沒有吵鬧的聲音','跑得非常快','顏色很漂亮','東西很重'],0,'安靜表示沒有嘈雜的聲音。');
add('國語',2,'拼字','哪一個字和「說話」有關？',['語','跑','林','明'],0,'「語」和語言、說話有關。');
add('國語',2,'形容詞','請選出最適合的詞：\n「爺爺的鬍子＿＿＿的。」',['白白','甜甜','亮亮','圓圓'],0,'爺爺的鬍子常可用「白白的」來形容。');
add('國語',2,'改錯字','請找出錯字：\n「今天的天氣真晴朗，適合郊由。」',['氣 → 汽','朗 → 狼','郊由 → 郊遊','合 → 和'],2,'到郊外遊玩叫作「郊遊」。');
add('國語',2,'句子理解','「小美把雨傘借給沒有帶傘的同學。」小美是一個怎樣的人？',['樂於幫助別人','喜歡生氣','不愛上學','很粗心'],0,'把雨傘借給同學，表示小美願意幫助別人。');
add('國語',2,'造句','哪一句正確使用了「因為……所以……」？',['因為下雨，所以我們帶雨傘。','因為我們帶雨傘，下雨所以。','下雨因為，所以帶雨傘。','所以因為雨傘下雨。'],0,'「因為……所以……」用來說明原因和結果。');
add('國語',2,'詞語','「圖書館裡要＿＿＿說話。」',['小聲','大聲','快速','用力'],0,'圖書館需要保持安靜，要小聲說話。');
add('國語',2,'拼字','「認真」的「認」和哪個意思最有關？',['知道、承認','跑步、跳躍','唱歌、跳舞','吃飯、喝水'],0,'「認」有知道、辨認、承認的意思。');
add('國語',2,'形容詞','請選出最適合的詞：\n「剛洗好的衣服＿＿＿的。」',['濕濕','乾乾','尖尖','酸酸'],0,'剛洗好的衣服還沒有曬乾，所以是濕濕的。');
add('國語',2,'改錯字','請找出錯字：\n「老師稱讚小偉很有里貌。」',['師 → 獅','讚 → 贊','里 → 禮','偉 → 緯'],2,'懂得禮節叫「有禮貌」。');
add('國語',2,'句子排序','請選出語意最通順的句子。',['弟弟認真地拼拼圖。','認真地弟弟拼拼圖。','拼圖弟弟地認真。','地拼圖認真弟弟。'],0,'主詞「弟弟」後接動作「認真地拼拼圖」，最通順。');
add('國語',2,'造句','哪一句正確使用了「終於」？',['我終於把作業寫完了。','終於我書包一個。','媽媽買終於菜。','終於小狗很可愛。'],0,'「終於」表示經過一段時間後，事情最後完成或發生。');
add('國語',2,'詞語理解','「仔細」最接近哪一個意思？',['用心、不馬虎','很快地跑','很大聲地說','很早睡覺'],0,'仔細表示做事用心、注意細節。');
add('國語',2,'詞語','「放學後，我和同學到＿＿＿盪鞦韆。」',['公園','廚房','醫院','書店'],0,'盪鞦韆通常在公園的遊樂設施區。');
add('國語',2,'選擇題','「弟弟感冒了，身體很虛弱。」哪一個說法正確？',['句子沒有錯字','「弟」要改成「第」','「冒」要改成「帽」','「虛」要改成「須」'],0,'這一句的字都正確。');
add('國語',2,'形容詞','請選出最適合的詞：\n「這條毛巾摸起來＿＿＿的。」',['柔軟','吵鬧','明亮','快速'],0,'毛巾摸起來可以用「柔軟」形容。');

let subject = '';
let grades = [];
let selectedTypes = [];
let selectedCount = 10;
let testQuestions = [];
let index = 0;
let current = null;
let answered = false;
let correct = 0;
let answeredCount = 0;
let wrongQuestions = [];
let retryMode = false;
const $ = id => document.getElementById(id);

function shuffle(list) { const a = [...list]; for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function uniqueTypesForSubject() { return [...new Set(questionBank.filter(q => q.subject === subject).map(q => q.type))].sort((a,b)=>a.localeCompare(b,'zh-Hant')); }
function renderTypeFilters() {
  const box = $('typeFilters'); box.innerHTML = '';
  if (!subject) { box.innerHTML = '<p class="tips">請先選擇科目。</p>'; return; }
  uniqueTypesForSubject().forEach(type => {
    const label = document.createElement('label'); label.className = 'type-label';
    label.innerHTML = `<input type="checkbox" value="${type}">${type}`;
    box.appendChild(label);
  });
}

document.querySelectorAll('.subject-btn').forEach(btn => btn.addEventListener('click', () => {
  subject = btn.dataset.subject;
  document.querySelectorAll('.subject-btn').forEach(b => b.classList.toggle('active', b === btn));
  renderTypeFilters();
}));

document.querySelectorAll('.number-btn').forEach(btn => btn.addEventListener('click', () => {
  selectedCount = Number(btn.dataset.count);
  document.querySelectorAll('.number-btn').forEach(b => b.classList.toggle('active', b === btn));
}));

$('startBtn').addEventListener('click', () => startTest());
$('nextBtn').addEventListener('click', () => { if (!answered) { alert('請先選擇答案，再進入下一題。'); return; } nextQuestion(); });
$('submitBtn').addEventListener('click', () => { if (confirm('確定要現在交卷嗎？尚未作答的題目不會計分。')) showResults(); });
$('backBtn').addEventListener('click', () => { $('quiz').classList.add('hidden'); $('setup').classList.remove('hidden'); clearCanvas(); });
$('newTestBtn').addEventListener('click', () => { $('result').classList.add('hidden'); $('setup').classList.remove('hidden'); });
$('retryWrongBtn').addEventListener('click', () => {
  if (!wrongQuestions.length) return;
  retryMode = true; testQuestions = shuffle(wrongQuestions.map(x => x.question)); index = 0; correct = 0; answeredCount = 0; wrongQuestions = [];
  $('result').classList.add('hidden'); $('quiz').classList.remove('hidden'); showQuestion();
});

function startTest() {
  grades = [...document.querySelectorAll('.grade-label input:checked')].map(i => Number(i.value));
  selectedTypes = [...document.querySelectorAll('#typeFilters input:checked')].map(i => i.value);
  if (!subject) return alert('請先選擇「國語」或「數學」。');
  if (!grades.length) return alert('請至少勾選一個年級。');
  let pool = questionBank.filter(q => q.subject === subject && grades.includes(q.grade));
  if (selectedTypes.length) pool = pool.filter(q => selectedTypes.includes(q.type));
  if (!pool.length) return alert('找不到符合條件的題目，請調整題型或年級。');
  testQuestions = shuffle(pool);
  if (selectedCount > 0) testQuestions = testQuestions.slice(0, Math.min(selectedCount, testQuestions.length));
  index = 0; correct = 0; answeredCount = 0; wrongQuestions = []; retryMode = false;
  $('setup').classList.add('hidden'); $('result').classList.add('hidden'); $('quiz').classList.remove('hidden');
  showQuestion();
}

function showQuestion() {
  if (index >= testQuestions.length) { showResults(); return; }
  current = testQuestions[index]; answered = false;
  $('subjectBadge').textContent = current.subject;
  $('gradeBadge').textContent = `${current.grade} 年級`;
  $('typeBadge').textContent = current.type;
  $('question').textContent = current.q;
  $('feedback').textContent = ''; $('feedback').className = 'feedback';
  $('options').innerHTML = '';
  shuffle(current.options.map((text,answerIndex)=>({text,answerIndex}))).forEach(item => {
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'option'; btn.textContent = item.text;
    btn.addEventListener('click', () => checkAnswer(item.answerIndex, btn)); $('options').appendChild(btn);
  });
  $('workArea').classList.toggle('hidden', current.subject !== '數學');
  if (current.subject === '數學') { resizeCanvas(); clearCanvas(); }
  updateStatus();
}

function checkAnswer(answerIndex, selectedButton) {
  if (answered) return;
  answered = true; answeredCount++;
  const buttons = [...document.querySelectorAll('.option')]; buttons.forEach(b => b.disabled = true);
  const isCorrect = answerIndex === current.answer;
  const correctButton = buttons.find(b => b.textContent === current.options[current.answer]);
  if (isCorrect) {
    correct++; selectedButton.classList.add('correct');
    $('feedback').textContent = `答對了！${current.explain}`; $('feedback').className = 'feedback ok';
  } else {
    selectedButton.classList.add('wrong'); if (correctButton) correctButton.classList.add('correct');
    wrongQuestions.push({question:current, chosen:current.options[answerIndex]});
    $('feedback').textContent = `再想一想！${current.explain}`; $('feedback').className = 'feedback bad';
  }
  updateStatus();
}

function nextQuestion() { index++; showQuestion(); }
function updateStatus() {
  const total = testQuestions.length;
  $('score').textContent = `答對 ${correct}／${answeredCount} 題`;
  $('remaining').textContent = `第 ${index + 1}／${total} 題${retryMode ? '（錯題複習）' : ''}`;
  $('progressBar').style.width = `${(index / total) * 100}%`;
  $('nextBtn').textContent = index === total - 1 ? '完成並交卷' : '下一題';
}

function showResults() {
  $('quiz').classList.add('hidden'); $('result').classList.remove('hidden'); clearCanvas();
  const name = $('studentName').value.trim();
  const total = testQuestions.length;
  const percent = total ? Math.round((correct / total) * 100) : 0;
  $('resultName').textContent = name ? `${name} 的測驗結果` : '本次測驗結果';
  $('resultScore').textContent = `答對 ${correct}／${total} 題，正確率 ${percent}%`;
  $('resultMessage').textContent = percent >= 90 ? '太棒了！繼續保持！' : percent >= 70 ? '表現很好，再複習錯題會更進步！' : '別灰心，從錯題再練一次，就會越來越熟練！';
  const list = $('wrongList'); list.innerHTML = '';
  if (!wrongQuestions.length) {
    list.innerHTML = '<div class="empty">全部答對，沒有錯題！</div>';
    $('retryWrongBtn').classList.add('hidden');
  } else {
    $('retryWrongBtn').classList.remove('hidden');
    wrongQuestions.forEach((item,n) => {
      const q = item.question; const card = document.createElement('article'); card.className = 'wrong-card';
      card.innerHTML = `<p><strong>第 ${n+1} 題｜${q.subject} ${q.grade} 年級・${q.type}</strong></p><p>${escapeHtml(q.q)}</p><p>你的答案：${escapeHtml(item.chosen)}</p><p class="answer">正確答案：${escapeHtml(q.options[q.answer])}</p><p>解說：${escapeHtml(q.explain)}</p>`;
      list.appendChild(card);
    });
  }
}
function escapeHtml(text) { return String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const canvas = $('workCanvas'); const ctx = canvas.getContext('2d'); let drawing = false; let lastX = 0; let lastY = 0;
function resizeCanvas() {
  const ratio = window.devicePixelRatio || 1; const rect = canvas.getBoundingClientRect();
  if (canvas.width !== Math.round(rect.width * ratio) || canvas.height !== Math.round(rect.height * ratio)) {
    const old = document.createElement('canvas'); old.width = canvas.width; old.height = canvas.height; old.getContext('2d').drawImage(canvas,0,0);
    canvas.width = Math.round(rect.width * ratio); canvas.height = Math.round(rect.height * ratio);
    ctx.setTransform(ratio,0,0,ratio,0,0); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1f2937'; ctx.lineWidth = 3;
  }
}
function clearCanvas() { if (!canvas.width) return; ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,canvas.width,canvas.height); ctx.restore(); }
function point(e) { const r = canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
canvas.addEventListener('pointerdown', e => { drawing=true; canvas.setPointerCapture(e.pointerId); const p=point(e); lastX=p.x; lastY=p.y; });
canvas.addEventListener('pointermove', e => { if (!drawing) return; const p=point(e); ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke(); lastX=p.x; lastY=p.y; });
canvas.addEventListener('pointerup', () => drawing=false); canvas.addEventListener('pointercancel', () => drawing=false);
$('clearCanvasBtn').addEventListener('click', clearCanvas); window.addEventListener('resize', () => { if (!$('workArea').classList.contains('hidden')) resizeCanvas(); });
renderTypeFilters();
</script>
