<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>國小國語・數學綜合練習</title>
  <style>
    :root{--blue:#2563eb;--blue-dark:#1d4ed8;--green:#15803d;--red:#dc2626;--ink:#1f2937;--muted:#64748b}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,#e0f2fe,#fef3c7)}
    .wrap{max-width:960px;margin:auto;padding:28px 16px 52px}header{text-align:center;margin-bottom:22px}h1{margin:0;color:var(--blue-dark);font-size:clamp(1.7rem,5vw,2.45rem)}header p{color:#475569;margin:8px 0 0}.card{background:rgba(255,255,255,.97);border-radius:20px;padding:24px;box-shadow:0 12px 32px rgba(30,64,175,.15)}.hidden{display:none!important}h2{margin:0 0 14px;font-size:1.25rem}h3{margin:20px 0 10px;font-size:1.05rem}
    .subject-row,.grade-grid,.type-grid,.number-grid{display:flex;flex-wrap:wrap;gap:12px}.subject-btn{flex:1 1 180px;min-height:78px;border:3px solid #bfdbfe;background:#eff6ff;border-radius:16px;cursor:pointer;color:#1e40af;font-size:1.2rem;font-weight:700}.subject-btn.active{border-color:var(--blue);background:#dbeafe;box-shadow:0 0 0 3px #bfdbfe}.grade-label,.type-label{display:flex;align-items:center;justify-content:center;gap:7px;flex:1 1 140px;min-height:52px;padding:8px 10px;border:2px solid #e2e8f0;border-radius:12px;cursor:pointer;font-weight:700}.grade-label:has(input:checked),.type-label:has(input:checked){background:#ecfdf5;border-color:#22c55e;color:#166534}input[type=checkbox]{width:18px;height:18px;accent-color:#16a34a}input[type=text]{width:100%;padding:12px 14px;border:2px solid #cbd5e1;border-radius:12px;font:inherit;font-size:1rem}
    .number-btn{flex:1 1 95px;min-height:50px;border:2px solid #cbd5e1;background:#fff;color:#334155}.number-btn.active{background:#dbeafe;border-color:var(--blue);color:var(--blue-dark)}button{border:0;border-radius:12px;padding:12px 19px;cursor:pointer;font-size:1rem;font-weight:700}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:22px}.primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue-dark)}.secondary{background:#e2e8f0;color:#334155}.danger{background:#fee2e2;color:#991b1b}.small{padding:8px 12px;font-size:.9rem}.notice{margin:13px 0 0;padding:11px 13px;border-radius:12px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;text-align:center;font-weight:700}.notice.warn{background:#fff7ed;border-color:#fdba74;color:#9a3412}
    .quiz-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}.badges{display:flex;gap:7px;flex-wrap:wrap}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-weight:700;font-size:.94rem}.score{font-weight:700;color:#475569}.progress{height:9px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:12px 0 0}.progress>div{height:100%;width:0;background:linear-gradient(90deg,#22c55e,#3b82f6);transition:width .25s}.tips{color:var(--muted);font-size:.92rem;margin:12px 0 0;text-align:center}.question-box{margin-top:14px;background:#f8fafc;border:2px solid #e2e8f0;border-radius:16px;padding:20px}.question{white-space:pre-line;font-size:1.35rem;font-weight:700;line-height:1.7;margin:0 0 18px}.options{display:grid;gap:10px}.option{width:100%;text-align:left;background:#fff;border:2px solid #cbd5e1;color:#334155;padding:13px 15px;border-radius:12px;font-weight:600}.option:hover:not(:disabled){border-color:#60a5fa;background:#eff6ff}.option.correct{background:#dcfce7;border-color:#22c55e;color:#166534}.option.wrong{background:#fee2e2;border-color:#ef4444;color:#991b1b}.feedback{min-height:31px;margin:15px 0 0;font-size:1.05rem;font-weight:700;line-height:1.55}.feedback.ok{color:var(--green)}.feedback.bad{color:var(--red)}
    .work-area{margin-top:16px;background:#fffdf4;border:2px dashed #f59e0b;border-radius:16px;padding:14px}.work-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.work-row h3{margin:0;color:#92400e}#workCanvas{display:block;width:100%;height:260px;background:#fff;border:2px solid #cbd5e1;border-radius:12px;touch-action:none;cursor:crosshair}.result-title{text-align:center;color:var(--blue-dark);font-size:1.65rem;margin:0 0 10px}.result-score{text-align:center;font-size:1.35rem;font-weight:800;color:#166534;margin:8px 0}.result-message{text-align:center;color:#475569;margin:8px 0 20px}.wrong-list{display:grid;gap:12px;margin-top:15px}.wrong-card{border:2px solid #fecaca;background:#fff7f7;border-radius:14px;padding:14px}.wrong-card p{margin:5px 0;line-height:1.55;white-space:pre-line}.answer{color:#166534;font-weight:700}.empty{padding:20px;text-align:center;color:#166534;background:#ecfdf5;border-radius:14px;font-weight:700}
    @media(max-width:560px){.card{padding:17px}.question{font-size:1.18rem}#workCanvas{height:210px}.grade-label,.type-label{flex-basis:125px}}
  </style>
</head>
<body>
<main class="wrap">
  <header><h1>🌟 國小綜合練習</h1><p>題目不重複；題庫不足時會自動減少題數。</p></header>
  <section id="setup" class="card">
    <h2>1. 選擇科目</h2><div class="subject-row"><button class="subject-btn" type="button" data-subject="國語">📖 國語</button><button class="subject-btn" type="button" data-subject="數學">🔢 數學</button></div>
    <h2 style="margin-top:24px">2. 複選年級</h2><div class="grade-grid"><label class="grade-label"><input type="checkbox" value="1">一年級</label><label class="grade-label"><input type="checkbox" value="2">二年級</label><label class="grade-label"><input type="checkbox" value="3">三年級</label><label class="grade-label"><input type="checkbox" value="4">四年級</label></div>
    <h2 style="margin-top:24px">3. 選擇題型（可複選）</h2><div id="typeFilters" class="type-grid"></div><p class="tips">不勾選題型時，會使用所選年級的所有題型。</p>
    <h2 style="margin-top:24px">4. 設定測驗</h2><h3>學生姓名（選填）</h3><input id="studentName" type="text" maxlength="20" placeholder="例如：小明"><h3>題數</h3><div class="number-grid"><button class="number-btn active" type="button" data-count="10">10 題</button><button class="number-btn" type="button" data-count="20">20 題</button><button class="number-btn" type="button" data-count="30">30 題</button><button class="number-btn" type="button" data-count="0">全部</button></div><div id="availableNotice" class="notice">請先選擇科目與年級，查看可用題數。</div><div class="actions"><button id="startBtn" class="primary" type="button">開始測驗</button></div>
  </section>
  <section id="quiz" class="card hidden" aria-live="polite"><div class="quiz-top"><div class="badges"><span id="subjectBadge" class="badge"></span><span id="gradeBadge" class="badge"></span><span id="typeBadge" class="badge"></span></div><div id="score" class="score">答對 0／0 題</div></div><div class="progress"><div id="progressBar"></div></div><p id="remaining" class="tips"></p><div class="question-box"><p id="question" class="question"></p><div id="options" class="options"></div><p id="feedback" class="feedback"></p></div><section id="workArea" class="work-area hidden"><div class="work-row"><h3>✏️ 數學驗算區</h3><button id="clearCanvasBtn" class="danger small" type="button">清除筆跡</button></div><p class="tips" style="margin:0 0 9px">可用滑鼠、手指或觸控筆在空白處手寫驗算。</p><canvas id="workCanvas" aria-label="數學手寫驗算區"></canvas></section><div class="actions"><button id="nextBtn" class="primary" type="button">下一題</button><button id="submitBtn" class="secondary" type="button">提早交卷</button><button id="backBtn" class="secondary" type="button">重新設定</button></div></section>
  <section id="result" class="card hidden"><h2 class="result-title">🎉 測驗完成</h2><p id="resultName" class="result-message"></p><p id="resultScore" class="result-score"></p><p id="resultMessage" class="result-message"></p><h3>錯題整理</h3><div id="wrongList" class="wrong-list"></div><div class="actions"><button id="retryWrongBtn" class="primary" type="button">只練錯題</button><button id="newTestBtn" class="secondary" type="button">重新設定新測驗</button></div></section>
</main>
<script>
const questionBank=[];
function add(subject,grade,type,q,options,answer,explain){questionBank.push({subject,grade,type,q,options,answer,explain});}
function makeMath(g, type, q, options, answer, explain){add('數學',g,type,q,options,answer,explain)}
function makeChinese(g,type,q,options,answer,explain){add('國語',g,type,q,options,answer,explain)}

// 題庫：選擇「全部題型」時，每一科、每一年級都有至少 60 題。
// 國語一年級
[

let subject='',grades=[],selectedTypes=[],selectedCount=10,testQuestions=[],index=0,current=null,answered=false,correct=0,answeredCount=0,wrongQuestions=[],retryMode=false;
const $=id=>document.getElementById(id);
function shuffle(list){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function renderTypeFilters(){const box=$('typeFilters');box.innerHTML='';if(!subject){box.innerHTML='<p class="tips">請先選擇科目。</p>';return}const types=[...new Set(questionBank.filter(q=>q.subject===subject).map(q=>q.type))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));types.forEach(type=>{const label=document.createElement('label');label.className='type-label';label.innerHTML=`<input type="checkbox" value="${type}">${type}`;label.querySelector('input').addEventListener('change',updateAvailable);box.appendChild(label)});updateAvailable()}
function getPool(){grades=[...document.querySelectorAll('.grade-label input:checked')].map(i=>Number(i.value));selectedTypes=[...document.querySelectorAll('#typeFilters input:checked')].map(i=>i.value);let pool=questionBank.filter(q=>q.subject===subject&&grades.includes(q.grade));if(selectedTypes.length)pool=pool.filter(q=>selectedTypes.includes(q.type));return pool}
function updateAvailable(){const notice=$('availableNotice');if(!subject||!document.querySelectorAll('.grade-label input:checked').length){notice.textContent='請先選擇科目與至少一個年級，查看可用題數。';notice.className='notice';return}const n=getPool().length;if(!n){notice.textContent='目前條件沒有符合的題目，請調整年級或題型。';notice.className='notice warn';return}const shown=selectedCount===0?n:Math.min(selectedCount,n);notice.textContent=`目前符合條件的題庫有 ${n} 題；本次會出 ${shown} 題，且完全不重複。`;notice.className=selectedCount>n?'notice warn':'notice'}
document.querySelectorAll('.subject-btn').forEach(btn=>btn.addEventListener('click',()=>{subject=btn.dataset.subject;document.querySelectorAll('.subject-btn').forEach(b=>b.classList.toggle('active',b===btn));renderTypeFilters();updateAvailable()}));
document.querySelectorAll('.grade-label input').forEach(input=>input.addEventListener('change',updateAvailable));
document.querySelectorAll('.number-btn').forEach(btn=>btn.addEventListener('click',()=>{selectedCount=Number(btn.dataset.count);document.querySelectorAll('.number-btn').forEach(b=>b.classList.toggle('active',b===btn));updateAvailable()}));
$('startBtn').addEventListener('click',startTest);$('nextBtn').addEventListener('click',()=>{if(!answered){alert('請先選擇答案，再進入下一題。');return}index++;showQuestion()});$('submitBtn').addEventListener('click',()=>{if(confirm('確定要現在交卷嗎？尚未作答的題目不會計分。'))showResults()});$('backBtn').addEventListener('click',()=>{$('quiz').classList.add('hidden');$('setup').classList.remove('hidden');clearCanvas()});$('newTestBtn').addEventListener('click',()=>{$('result').classList.add('hidden');$('setup').classList.remove('hidden');updateAvailable()});$('retryWrongBtn').addEventListener('click',()=>{if(!wrongQuestions.length)return;retryMode=true;testQuestions=shuffle(wrongQuestions.map(x=>x.question));index=0;correct=0;answeredCount=0;wrongQuestions=[];$('result').classList.add('hidden');$('quiz').classList.remove('hidden');showQuestion()});
function startTest(){if(!subject)return alert('請先選擇「國語」或「數學」。');const pool=getPool();if(!grades.length)return alert('請至少勾選一個年級。');if(!pool.length)return alert('找不到符合條件的題目，請調整題型或年級。');testQuestions=shuffle(pool);if(selectedCount>0&&selectedCount<testQuestions.length)testQuestions=testQuestions.slice(0,selectedCount);if(selectedCount>testQuestions.length)alert(`符合條件的題目只有 ${testQuestions.length} 題，本次將出這 ${testQuestions.length} 題，題目不會重複。`);index=0;correct=0;answeredCount=0;wrongQuestions=[];retryMode=false;$('setup').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');showQuestion()}
function showQuestion(){if(index>=testQuestions.length){showResults();return}current=testQuestions[index];answered=false;$('subjectBadge').textContent=current.subject;$('gradeBadge').textContent=`${current.grade} 年級`;$('typeBadge').textContent=current.type;$('question').textContent=current.q;$('feedback').textContent='';$('feedback').className='feedback';$('options').innerHTML='';shuffle(current.options.map((text,answerIndex)=>({text,answerIndex}))).forEach(item=>{const btn=document.createElement('button');btn.type='button';btn.className='option';btn.textContent=item.text;btn.addEventListener('click',()=>checkAnswer(item.answerIndex,btn));$('options').appendChild(btn)});$('workArea').classList.toggle('hidden',current.subject!=='數學');if(current.subject==='數學'){resizeCanvas();clearCanvas()}updateStatus()}
function checkAnswer(answerIndex,selectedButton){if(answered)return;answered=true;answeredCount++;const buttons=[...document.querySelectorAll('.option')];buttons.forEach(b=>b.disabled=true);const correctButton=buttons.find(b=>b.textContent===current.options[current.answer]);if(answerIndex===current.answer){correct++;selectedButton.classList.add('correct');$('feedback').textContent=`答對了！${current.explain}`;$('feedback').className='feedback ok'}else{selectedButton.classList.add('wrong');if(correctButton)correctButton.classList.add('correct');wrongQuestions.push({question:current,chosen:current.options[answerIndex]});$('feedback').textContent=`再想一想！${current.explain}`;$('feedback').className='feedback bad'}updateStatus()}
function updateStatus(){const total=testQuestions.length;$('score').textContent=`答對 ${correct}／${answeredCount} 題`;$('remaining').textContent=`第 ${index+1}／${total} 題${retryMode?'（錯題複習）':''}`;$('progressBar').style.width=`${(index/total)*100}%`;$('nextBtn').textContent=index===total-1?'完成並交卷':'下一題'}
function showResults(){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');clearCanvas();const name=$('studentName').value.trim(),total=testQuestions.length,percent=total?Math.round(correct/total*100):0;$('resultName').textContent=name?`${name} 的測驗結果`:'本次測驗結果';$('resultScore').textContent=`答對 ${correct}／${total} 題，正確率 ${percent}%`;$('resultMessage').textContent=percent>=90?'太棒了！繼續保持！':percent>=70?'表現很好，再複習錯題會更進步！':'別灰心，從錯題再練一次，就會越來越熟練！';const list=$('wrongList');list.innerHTML='';if(!wrongQuestions.length){list.innerHTML='<div class="empty">全部答對，沒有錯題！</div>';$('retryWrongBtn').classList.add('hidden')}else{$('retryWrongBtn').classList.remove('hidden');wrongQuestions.forEach((item,n)=>{const q=item.question,card=document.createElement('article');card.className='wrong-card';card.innerHTML=`<p><strong>第 ${n+1} 題｜${q.subject} ${q.grade} 年級・${q.type}</strong></p><p>${escapeHtml(q.q)}</p><p>你的答案：${escapeHtml(item.chosen)}</p><p class="answer">正確答案：${escapeHtml(q.options[q.answer])}</p><p>解說：${escapeHtml(q.explain)}</p>`;list.appendChild(card)})}}
function escapeHtml(text){return String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const canvas=$('workCanvas'),ctx=canvas.getContext('2d');let drawing=false,lastX=0,lastY=0;function resizeCanvas(){const ratio=window.devicePixelRatio||1,rect=canvas.getBoundingClientRect();if(!rect.width)return;if(canvas.width!==Math.round(rect.width*ratio)||canvas.height!==Math.round(rect.height*ratio)){canvas.width=Math.round(rect.width*ratio);canvas.height=Math.round(rect.height*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#1f2937';ctx.lineWidth=3}}function clearCanvas(){if(!canvas.width)return;ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.restore()}function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}canvas.addEventListener('pointerdown',e=>{drawing=true;canvas.setPointerCapture(e.pointerId);const p=point(e);lastX=p.x;lastY=p.y});canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e);ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.stroke();lastX=p.x;lastY=p.y});canvas.addEventListener('pointerup',()=>drawing=false);canvas.addEventListener('pointercancel',()=>drawing=false);$('clearCanvasBtn').addEventListener('click',clearCanvas);window.addEventListener('resize',()=>{if(!$('workArea').classList.contains('hidden'))resizeCanvas()});renderTypeFilters();
</script>
