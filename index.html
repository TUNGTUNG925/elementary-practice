<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>國小國語・數學綜合練習</title>
  <style>
    :root { --primary:#2563eb; --accent:#f59e0b; --ok:#15803d; --bad:#dc2626; --ink:#1f2937; --bg:#eef6ff; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; color:var(--ink); background:linear-gradient(135deg,#e0f2fe,#fef3c7); min-height:100vh; }
    .wrap { max-width:900px; margin:auto; padding:28px 16px 48px; }
    header { text-align:center; margin-bottom:22px; }
    h1 { margin:0; font-size:clamp(1.7rem,5vw,2.45rem); color:#1d4ed8; }
    header p { margin:8px 0 0; color:#475569; }
    .card { background:rgba(255,255,255,.96); border-radius:20px; padding:22px; box-shadow:0 12px 32px rgba(30,64,175,.15); }
    .hidden { display:none !important; }
    h2 { margin:0 0 14px; font-size:1.28rem; }
    .subject-row,.grade-grid { display:flex; gap:12px; flex-wrap:wrap; }
    .subject-btn { flex:1 1 180px; border:3px solid #bfdbfe; background:#eff6ff; border-radius:16px; min-height:78px; cursor:pointer; font-size:1.2rem; font-weight:700; color:#1e40af; }
    .subject-btn.active { border-color:var(--primary); background:#dbeafe; box-shadow:0 0 0 3px #bfdbfe; }
    .grade-label { display:flex; align-items:center; justify-content:center; gap:7px; flex:1 1 140px; min-height:54px; padding:8px; border:2px solid #e2e8f0; border-radius:12px; cursor:pointer; font-size:1.05rem; font-weight:700; }
    .grade-label:has(input:checked) { background:#ecfdf5; border-color:#22c55e; color:#166534; }
    input[type="checkbox"] { width:19px; height:19px; accent-color:#16a34a; }
    .actions { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:22px; }
    button { border:0; border-radius:12px; padding:12px 19px; cursor:pointer; font-size:1rem; font-weight:700; }
    .primary { background:var(--primary); color:#fff; } .primary:hover { background:#1d4ed8; }
    .secondary { background:#e2e8f0; color:#334155; } .secondary:hover { background:#cbd5e1; }
    .quiz-top { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
    .badge { display:inline-block; padding:6px 10px; border-radius:999px; background:#dbeafe; color:#1d4ed8; font-weight:700; }
    .score { font-weight:700; color:#475569; }
    .question-box { background:#f8fafc; border:2px solid #e2e8f0; border-radius:16px; padding:20px; }
    .question { white-space:pre-line; font-size:1.35rem; font-weight:700; line-height:1.7; margin:0 0 18px; }
    .options { display:grid; gap:10px; }
    .option { width:100%; text-align:left; background:#fff; border:2px solid #cbd5e1; color:#334155; padding:13px 15px; border-radius:12px; font-weight:600; }
    .option:hover:not(:disabled) { border-color:#60a5fa; background:#eff6ff; }
    .option.correct { background:#dcfce7; border-color:#22c55e; color:#166534; }
    .option.wrong { background:#fee2e2; border-color:#ef4444; color:#991b1b; }
    .feedback { min-height:31px; margin:15px 0 0; font-size:1.05rem; font-weight:700; line-height:1.5; }
    .feedback.ok { color:var(--ok); } .feedback.bad { color:var(--bad); }
    .tips { font-size:.92rem; color:#64748b; margin:16px 0 0; text-align:center; }
    .progress { height:9px; background:#e2e8f0; border-radius:99px; overflow:hidden; margin:12px 0 0; }
    .progress > div { height:100%; width:0; background:linear-gradient(90deg,#22c55e,#3b82f6); transition:width .25s; }
    @media (max-width:520px) { .card{padding:17px} .question{font-size:1.18rem} }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>🌟 國小綜合練習</h1>
      <p>先選科目，再勾選一個或多個年級；題目會隨機、不重複抽出。</p>
    </header>

    <section id="setup" class="card">
      <h2>1. 選擇科目</h2>
      <div class="subject-row" aria-label="選擇科目">
        <button class="subject-btn" type="button" data-subject="國語">📖 國語</button>
        <button class="subject-btn" type="button" data-subject="數學">🔢 數學</button>
      </div>
      <h2 style="margin-top:24px">2. 複選要練習的年級</h2>
      <div class="grade-grid">
        <label class="grade-label"><input type="checkbox" value="1">一年級</label>
        <label class="grade-label"><input type="checkbox" value="2">二年級</label>
        <label class="grade-label"><input type="checkbox" value="3">三年級</label>
        <label class="grade-label"><input type="checkbox" value="4">四年級</label>
      </div>
      <div class="actions"><button id="startBtn" class="primary" type="button">開始練習</button></div>
      <p class="tips">每個科目、每個年級約有 24 題；可重複按「換一題」持續練習。</p>
    </section>

    <section id="quiz" class="card hidden" aria-live="polite">
      <div class="quiz-top">
        <div><span id="subjectBadge" class="badge"></span> <span id="gradeBadge" class="badge"></span> <span id="type" class="badge"></span></div>
        <div id="score" class="score">答對 0／0 題</div>
      </div>
      <div class="progress"><div id="progressBar"></div></div>
      <p id="remaining" class="tips"></p>
      <div class="question-box">
        <p id="question" class="question"></p>
        <div id="options" class="options"></div>
        <p id="feedback" class="feedback"></p>
      </div>
      <div class="actions">
        <button id="nextBtn" class="primary" type="button">換一題</button>
        <button id="backBtn" class="secondary" type="button">重新選擇</button>
      </div>
    </section>
  </main>

<script>

  {subject:'國語',grade:1,type:'選正確形容詞',q:'請選出最適合的詞：\n「蘋果吃起來＿＿＿的。」',options:['甜甜','跑跑','看看','睡睡'],answer:0,explain:'「甜甜」可以形容蘋果的味道。'},
  {subject:'國語',grade:1,type:'造句',q:'哪一句話正確使用了「開心」？',options:['我今天得到禮物，覺得很開心。','開心在桌上寫字。','媽媽買開心回家。','小狗開心一碗飯。'],answer:0,explain:'「開心」用來形容快樂的心情。'},
  {subject:'國語',grade:1,type:'選正確形容詞',q:'請選出最適合的詞：\n「白白的＿＿＿在天空飄。」',options:['雲朵','石頭','書包','鉛筆'],answer:0,explain:'白白的雲朵會在天空飄。'},
  {subject:'國語',grade:1,type:'拼字',q:'「花朵」的「朵」有幾畫？',options:['5畫','6畫','7畫','8畫'],answer:1,explain:'「朵」共有 6 畫。'},
  {subject:'國語',grade:1,type:'選正確詞語',q:'請選出可以放進句子的詞：\n「我每天＿＿＿去上學。」',options:['快快','高高','天天','早早'],answer:3,explain:'「早早去上學」語意最通順。'},
  {subject:'國語',grade:1,type:'造句',q:'哪一句正確使用了「一起」？',options:['我和弟弟一起看故事書。','一起書包在桌上。','媽媽一起買菜。','小鳥一起天空。'],answer:0,explain:'「一起」表示共同做一件事。'},
  {subject:'國語',grade:1,type:'選正確形容詞',q:'請選出最適合的詞：\n「冰淇淋吃起來＿＿＿的。」',options:['冰冰','熱熱','長長','高高'],answer:0,explain:'冰淇淋的感覺是冰冰的。'},
  {subject:'國語',grade:1,type:'拼字',q:'下面哪一個字和「手」有關？',options:['打','唱','明','花'],answer:0,explain:'「打」要用手來做。'},
  {subject:'國語',grade:1,type:'句子排序',q:'請選出正確的句子。',options:['小狗在院子裡跑。','在小狗跑院子裡。','院子裡小狗在跑。','跑小狗在裡院子。'],answer:0,explain:'「小狗在院子裡跑。」語序完整又通順。'},
  {subject:'國語',grade:1,type:'選正確形容詞',q:'請選出最適合的詞：\n「長頸鹿有＿＿＿的脖子。」',options:['長長','短短','小小','圓圓'],answer:0,explain:'長頸鹿的脖子長長的。'},
  {subject:'國語',grade:1,type:'拼字',q:'「雨」是什麼部首？',options:['雨','水','天','日'],answer:0,explain:'「雨」本身就是一個部首。'},
  {subject:'國語',grade:1,type:'造句',q:'哪一句話正確使用了「喜歡」？',options:['我喜歡吃媽媽煮的飯。','喜歡在桌上一本書。','小狗喜歡很可愛。','媽媽買喜歡回家。'],answer:0,explain:'「喜歡」可以說明自己愛好的事物。'},
  {subject:'國語',grade:1,type:'選正確詞語',q:'「爸爸在＿＿＿看報紙。」',options:['客廳','天空','書包','鉛筆'],answer:0,explain:'爸爸可以在客廳看報紙。'},
  {subject:'國語',grade:1,type:'改錯字',q:'請找出錯字：\n「我門一起去公園玩。」',options:['我門 → 我們','一起 → 一起','公園 → 公元','玩 → 完'],answer:0,explain:'「我們」表示自己和其他人，應寫作「們」。'},
  {subject:'國語',grade:1,type:'選正確形容詞',q:'請選出最適合的詞：\n「兔子的尾巴＿＿＿的。」',options:['短短','長長','大大','重重'],answer:0,explain:'兔子的尾巴短短的。'},
  {subject:'國語',grade:1,type:'詞語理解',q:'「早上」通常是什麼時候？',options:['太陽剛出來的時候','吃晚餐以後','要睡覺的時候','半夜的時候'],answer:0,explain:'早上是一天開始、太陽剛出來前後的時間。'},
  {subject:'國語',grade:1,type:'造句',q:'哪一句話正確使用了「正在」？',options:['妹妹正在寫功課。','正在妹妹一支筆。','書包正在桌上。','正在我喜歡吃飯。'],answer:0,explain:'「正在」表示一件事情此刻進行中。'},
  {subject:'國語',grade:1,type:'拼字',q:'下面哪一個字的讀音是「ㄏㄨㄚ」？',options:['花','草','樹','葉'],answer:0,explain:'「花」讀作 ㄏㄨㄚ。'},

  {subject:'國語',grade:2,type:'改錯字',q:'請找出錯字並選出正確寫法：\n「小朋友排隊進入博物管。」',options:['朋 → 棚','隊 → 對','管 → 館','進 → 近'],answer:2,explain:'收藏、展示文物的地方叫「博物館」。'},

  {subject:'國語',grade:2,type:'選正確形容詞',q:'請選出最適合的詞：\n「爺爺的鬍子＿＿＿的。」',options:['白白','甜甜','亮亮','圓圓'],answer:0,explain:'爺爺的鬍子常可用「白白的」來形容。'},
  {subject:'國語',grade:2,type:'改錯字',q:'請找出錯字：\n「今天的天氣真晴朗，適合郊由。」',options:['氣 → 汽','朗 → 狼','郊由 → 郊遊','合 → 和'],answer:2,explain:'到郊外遊玩叫作「郊遊」。'},

  {subject:'國語',grade:3,type:'選擇題',q:'下列句子哪一個沒有錯字？',options:['校園裡的花兒爭先恐後地開放。','校員裡的花兒爭先恐後地開放。','校園裡的花兒真先恐後地開放。','校園裡的花兒爭先空後地開放。'],answer:0,explain:'正確寫法是「校園裡的花兒爭先恐後地開放」。'},

let subject = '';
let grades = [];
let current = null;
let answered = false;
let total = 0;
let correct = 0;
let queue = [];
let queueIndex = 0;
const $ = id => document.getElementById(id);

function shuffle(items) {
  const a = [...items];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

document.querySelectorAll('.subject-btn').forEach(btn => btn.addEventListener('click', () => {
  subject = btn.dataset.subject;
  document.querySelectorAll('.subject-btn').forEach(b => b.classList.toggle('active', b === btn));
}));

$('startBtn').addEventListener('click', () => {
  grades = [...document.querySelectorAll('.grade-label input:checked')].map(i => Number(i.value));
  if (!subject) return alert('請先選擇「國語」或「數學」。');
  if (!grades.length) return alert('請至少勾選一個年級。');
  const pool = questionBank.filter(x => x.subject === subject && grades.includes(x.grade));
  queue = shuffle(pool);
  queueIndex = 0; total = 0; correct = 0;
  $('setup').classList.add('hidden');
  $('quiz').classList.remove('hidden');
  showQuestion();
});

$('nextBtn').addEventListener('click', showQuestion);
$('backBtn').addEventListener('click', () => {
  $('quiz').classList.add('hidden');
  $('setup').classList.remove('hidden');
});

function showQuestion() {
  if (queueIndex >= queue.length) {
    queue = shuffle(queue);
    queueIndex = 0;
  }
  current = queue[queueIndex++];
  answered = false;
  $('subjectBadge').textContent = subject;
  $('gradeBadge').textContent = `${current.grade} 年級`;
  $('type').textContent = current.type;
  $('question').textContent = current.q;
  $('feedback').textContent = '';
  $('feedback').className = 'feedback';
  updateStatus();
  const shuffledOptions = shuffle(current.options.map((text,index) => ({text,index})));
  $('options').innerHTML = '';
  shuffledOptions.forEach(item => {
    const button = document.createElement('button');
    button.className = 'option';
    button.type = 'button';
    button.textContent = item.text;
    button.addEventListener('click', () => checkAnswer(item.index, button));
    $('options').appendChild(button);
  });
}

function updateStatus() {
  $('score').textContent = `答對 ${correct}／${total} 題`;
  const done = queueIndex;
  const percent = queue.length ? (done / queue.length) * 100 : 0;
  $('progressBar').style.width = `${percent}%`;
  $('remaining').textContent = `本輪第 ${done}／${queue.length} 題；題庫用完後會重新洗牌繼續出題。`;
}

function checkAnswer(index, selected) {
  if (answered) return;
  answered = true;
  total++;
  const buttons = [...document.querySelectorAll('.option')];
  buttons.forEach(button => button.disabled = true);
  const correctText = current.options[current.answer];
  const answerButton = buttons.find(button => button.textContent === correctText);
  if (index === current.answer) {
    correct++;
    selected.classList.add('correct');
    $('feedback').textContent = `答對了！${current.explain}`;
    $('feedback').className = 'feedback ok';
  } else {
    selected.classList.add('wrong');
    if (answerButton) answerButton.classList.add('correct');
    $('feedback').textContent = `再想一想！${current.explain}`;
    $('feedback').className = 'feedback bad';
  }
  updateStatus();
}
</script>
